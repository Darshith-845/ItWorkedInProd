# DB Schema Mismatch Scenario
#
# Reproduces: Application expects schema v17 (with `subscription` column)
# but the database only has schema v16 (without it).
#
# When POST /checkout queries `SELECT email, name, subscription FROM users`,
# Postgres returns: column "subscription" does not exist

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 2s
      timeout: 3s
      retries: 10

  checkout-api:
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "3051:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://appuser:apppass@db:5432/appdb
    depends_on:
      db:
        condition: service_healthy
