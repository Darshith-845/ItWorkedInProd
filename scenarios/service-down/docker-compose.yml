# Service Dependency Failure Scenario
#
# Reproduces: Redis is unavailable, causing ECONNREFUSED.
# The checkout-api starts and accepts requests, but when it tries
# to connect to Redis to fetch cart data, the connection is refused.
#
# A named placeholder lets Docker DNS resolve "redis". It deliberately runs
# no Redis process, so TCP connections to redis:6379 are genuinely refused.

services:
  redis:
    image: alpine:3.20
    command: ["sh", "-c", "exec sleep infinity"]

  checkout-api:
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "3052:3000"
    environment:
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: 6379
    # Docker resolves redis to the placeholder container, which has no
    # listener on 6379. The app therefore receives ECONNREFUSED.
